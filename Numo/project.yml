# XcodeGen spec: `xcodegen generate` writes Numo.xcodeproj (not committed).
# Install with `brew install xcodegen`.
name: Numo

options:
  bundleIdPrefix: app.numo
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # Set your team here (or in Xcode: Signing & Capabilities) before running on your Mac.
    DEVELOPMENT_TEAM: ""

packages:
  NumoCore:
    path: Packages/NumoCore

targets:
  Numo:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Numo.entitlements
      - Services
      - Coordination
      - Windowing
      - Features
      - DesignSystem
    dependencies:
      - package: NumoCore
    settings:
      base:
        PRODUCT_NAME: numo
        PRODUCT_BUNDLE_IDENTIFIER: app.numo.Numo
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Numo.entitlements
