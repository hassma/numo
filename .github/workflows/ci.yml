name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-macos:
    name: NumoCore tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Numo/Packages/NumoCore

  core-linux:
    name: NumoCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Numo/Packages/NumoCore

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
